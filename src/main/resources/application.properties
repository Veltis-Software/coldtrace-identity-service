spring.application.name=coldtrace-identity-service
server.port=${PORT:8081}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ct_identity?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:ct_identity}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=com.acme.coldtrace.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
spring.messages.basename=messages
spring.messages.encoding=UTF-8
authorization.jwt.secret=${JWT_SECRET}
authorization.jwt.expiration.days=${JWT_EXPIRATION_DAYS:7}
coldtrace.subscription.url=${SUBSCRIPTION_URL:http://localhost:8088}
management.endpoints.web.exposure.include=health,info
springdoc.api-docs.path=/v3/api-docs
coldtrace.internal.service-key=${INTERNAL_SERVICE_KEY}
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:4200,http://127.0.0.1:4200}
cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
cors.allowed-headers=Authorization,Content-Type,X-Correlation-Id
cors.exposed-headers=X-Correlation-Id,Location
cors.max-age=3600
