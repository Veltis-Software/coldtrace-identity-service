name: Continuous integration
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B verify
      - run: docker build --tag coldtrace/service:${{ github.sha }} .
